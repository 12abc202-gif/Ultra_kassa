<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ultra Касса v4.0</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f5f5;
  height: 100vh;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
  background: #fff;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

/* Шапка */
.header {
  background: #2c7a2c;
  color: white;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.header h1 {
  font-size: 18px;
  font-weight: 600;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sync-status {
  font-size: 11px;
  background: rgba(255,255,255,0.2);
  padding: 4px 8px;
  border-radius: 20px;
}

.cashier-name {
  font-size: 13px;
  font-weight: 500;
}

/* Сканер */
.scanner-area {
  background: #000;
  position: relative;
  flex-shrink: 0;
}

#reader {
  width: 100%;
  max-height: 220px;
}

.scanner-controls {
  padding: 8px 12px;
  background: #1a1a1a;
  display: flex;
  gap: 10px;
}

.scanner-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.scanner-btn.on {
  background: #2c7a2c;
  color: white;
}

.scanner-btn.off {
  background: #555;
  color: white;
}

/* Поле ввода */
.input-area {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
  border-bottom: 1px solid #e0e0e0;
  flex-shrink: 0;
}

.input-area input {
  flex: 1;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  font-family: monospace;
  outline: none;
}

.input-area input:focus {
  border-color: #2c7a2c;
}

.input-area button {
  padding: 12px 20px;
  background: #2c7a2c;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

/* Быстрые кнопки */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 10px;
  background: #f9f9f9;
  border-bottom: 1px solid #e0e0e0;
  flex-shrink: 0;
}

.quick-btn {
  background: #fff3e0;
  border: 1px solid #ffcc80;
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.quick-btn:active {
  background: #ffe0b3;
  transform: scale(0.96);
}

.quick-name {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quick-price {
  font-size: 11px;
  color: #2c7a2c;
  font-weight: 600;
}

/* Корзина */
.cart {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.cart-item {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-info {
  flex: 1;
}

.cart-name {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 4px;
}

.cart-price {
  font-size: 12px;
  color: #666;
}

.cart-qty {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.qty-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: white;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

.qty-value {
  min-width: 50px;
  text-align: center;
  font-weight: 600;
}

.cart-total {
  font-weight: 700;
  font-size: 16px;
  color: #2c7a2c;
  min-width: 80px;
  text-align: right;
}

.cart-delete {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #dc3545;
  margin-left: 8px;
  padding: 0 8px;
}

/* Итого */
.total-bar {
  background: #e8f5e8;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 2px solid #c8e6c8;
  flex-shrink: 0;
}

.total-label {
  font-size: 16px;
  font-weight: 600;
}

.total-amount {
  font-size: 24px;
  font-weight: 700;
  color: #2c7a2c;
}

.pay-btn {
  background: #2c7a2c;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

/* Нижняя навигация */
.nav {
  display: flex;
  background: white;
  border-top: 1px solid #e0e0e0;
  flex-shrink: 0;
}

.nav-btn {
  flex: 1;
  padding: 12px;
  background: none;
  border: none;
  font-size: 12px;
  font-weight: 500;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-btn.active {
  color: #2c7a2c;
  border-top: 2px solid #2c7a2c;
}

/* Страницы */
.page {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.page.active {
  display: flex;
}

/* Таблицы */
.table-container {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px 8px;
  text-align: left;
  border-bottom: 1px solid #e0e0e0;
}

th {
  background: #f8f9fa;
  font-weight: 600;
  position: sticky;
  top: 0;
  font-size: 12px;
}

td {
  font-size: 13px;
}

.search-input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 14px;
  margin: 10px;
  width: calc(100% - 20px);
}

/* Модальные окна */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 20px;
  width: 90%;
  max-width: 350px;
  overflow: hidden;
}

.modal-header {
  padding: 16px;
  background: #2c7a2c;
  color: white;
  font-weight: 600;
  font-size: 16px;
}

.modal-body {
  padding: 20px;
}

.modal-footer {
  padding: 16px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #e0e0e0;
}

.modal-footer button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

.modal-footer button:first-child {
  background: #e0e0e0;
}

.modal-footer button:last-child {
  background: #2c7a2c;
  color: white;
}

.modal-body input {
  width: 100%;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
  outline: none;
}

.modal-body input:focus {
  border-color: #2c7a2c;
}

/* Статус */
.status-bar {
  padding: 6px 12px;
  background: #f0f0f0;
  font-size: 11px;
  color: #666;
  text-align: center;
  flex-shrink: 0;
  border-top: 1px solid #e0e0e0;
}

/* Утилиты */
.text-right {
  text-align: right;
}

.text-center {
  text-align: center;
}

.font-mono {
  font-family: monospace;
}

.stock-ok {
  color: #2c7a2c;
  font-weight: 600;
}

.stock-low {
  color: #ff9800;
  font-weight: 600;
}

.stock-out {
  color: #dc3545;
  font-weight: 600;
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>💰 Ultra Касса</h1>
    <div class="header-right">
      <span class="sync-status" id="syncStatus">🔄</span>
      <span class="cashier-name" id="cashierName">Кассир</span>
    </div>
  </div>

  <div id="pages">
    <!-- СТРАНИЦА ПРОДАЖИ -->
    <div class="page active" id="pageSale">
      <div class="scanner-area">
        <div id="reader"></div>
        <div class="scanner-controls">
          <button class="scanner-btn off" id="scannerBtn" onclick="toggleScanner()">📷 Вкл/Выкл</button>
        </div>
      </div>
      
      <div class="input-area">
        <input type="text" id="barcode" placeholder="Введите штрихкод или отсканируйте" autofocus>
        <button onclick="addByBarcode()">➕ Добавить</button>
      </div>
      
      <div class="quick-grid" id="quickGrid"></div>
      
      <div class="cart" id="cartList">
        <div style="text-align:center;color:#999;padding:40px">Корзина пуста<br>Отсканируйте товар</div>
      </div>
      
      <div class="total-bar">
        <span class="total-label">ИТОГО:</span>
        <span class="total-amount" id="totalAmount">0.00 ₸</span>
        <button class="pay-btn" onclick="showPayment()">💳 Оплатить</button>
      </div>
      
      <div class="status-bar" id="statusBar">✅ Готов к работе</div>
    </div>

    <!-- СТРАНИЦА ТОВАРЫ -->
    <div class="page" id="pageProducts">
      <input type="text" id="searchProducts" class="search-input" placeholder="🔍 Поиск по названию или штрихкоду" oninput="renderProducts()">
      <div class="table-container">
        <table id="productsTable">
          <thead>
            <tr>
              <th>Штрихкод</th>
              <th>Название</th>
              <th>Цена</th>
              <th>Остаток</th>
            </tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
      <div class="status-bar">📦 Управление товарами</div>
    </div>

    <!-- СТРАНИЦА ИСТОРИЯ -->
    <div class="page" id="pageHistory">
      <div class="table-container">
        <table id="historyTable">
          <thead>
            <tr>
              <th>№</th>
              <th>Дата</th>
              <th>Сумма</th>
              <th>Кассир</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="status-bar">📋 История продаж</div>
    </div>

    <!-- СТРАНИЦА СКЛАД -->
    <div class="page" id="pageStock">
      <input type="text" id="searchStock" class="search-input" placeholder="🔍 Поиск товара..." oninput="renderStock()">
      <div class="table-container">
        <table id="stockTable">
          <thead>
            <tr>
              <th>Штрихкод</th>
              <th>Название</th>
              <th>Цена</th>
              <th>Остаток</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
      <div class="status-bar">📦 Складской учёт</div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchPage('sale')">💰 Продажа</button>
    <button class="nav-btn" onclick="switchPage('products')">📦 Товары</button>
    <button class="nav-btn" onclick="switchPage('history')">📋 История</button>
    <button class="nav-btn" onclick="switchPage('stock')">🏪 Склад</button>
  </div>
</div>

<!-- МОДАЛКА ОПЛАТЫ -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">💳 Оплата</div>
    <div class="modal-body">
      <div style="font-size: 28px; text-align: center; margin-bottom: 16px; font-weight: 700; color: #2c7a2c;" id="modalTotal">0 ₸</div>
      <input type="number" id="cashAmount" placeholder="Сумма наличными" step="1">
      <div style="margin-top: 12px; font-size: 14px;">
        Сдача: <span id="changeAmount" style="font-weight: 700; font-size: 18px;">0</span> ₸
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('paymentModal')">Отмена</button>
      <button onclick="confirmPayment()">Подтвердить</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА КОЛИЧЕСТВА (для весовых товаров) -->
<div id="qtyModal" class="modal">
  <div class="modal-content">
    <div class="modal-header" id="qtyTitle">Введите количество</div>
    <div class="modal-body">
      <div id="qtyInfo" style="font-size: 12px; color: #666; margin-bottom: 8px; text-align: center;"></div>
      <input type="number" id="qtyValue" step="0.001" placeholder="0.000">
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('qtyModal')">Отмена</button>
      <button onclick="confirmQty()">OK</button>
    </div>
  </div>
</div>

<script>
// ==================== FIREBASE НАСТРОЙКИ ====================
const firebaseConfig = {
  apiKey: "AIzaSyBoAYvYi9FvacSrztDXBF1oXR0Qa9qvth8",
  authDomain: "my-program-3cbb8.firebaseapp.com",
  projectId: "my-program-3cbb8",
  storageBucket: "my-program-3cbb8.firebasestorage.app",
  messagingSenderId: "828897590974",
  appId: "1:828897590974:web:45f5dd35a2513ab18da8ef"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== НАСТРОЙКИ ПОЛЬЗОВАТЕЛЯ ====================
// ⚠️ ВАЖНО: Укажите имя пользователя из вашей Python-программы!
// Ваша Python-программа создала папку в Firestore: users/{ЭТО_ИМЯ}/products
const USER_NAME = "admin";  // <-- ЗАМЕНИТЕ НА ВАШЕ ИМЯ ПОЛЬЗОВАТЕЛЯ!

// Пути к данным (как в Python)
const getProductsRef = () => db.collection('users').doc(USER_NAME).collection('products');
const getSalesRef = () => db.collection('users').doc(USER_NAME).collection('sales');

// ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
let products = {};
let sales = [];
let cart = [];
let currentCashier = "Основной";
let pendingProduct = null;
let qtyCallback = null;

// Сканер
let html5QrCode = null;
let scannerActive = false;

// ==================== ЗАГРУЗКА ДАННЫХ ИЗ FIRESTORE ====================
async function loadData() {
  updateSyncStatus("⏳ Загрузка...");
  
  try {
    // Загружаем товары
    const productsSnapshot = await getProductsRef().get();
    products = {};
    
    for (const doc of productsSnapshot.docs) {
      const data = doc.data();
      products[doc.id] = {
        code: doc.id,
        name: data.name || "Без названия",
        price: data.price || 0,
        purchase_price: data.purchase_price || 0,
        quantity: data.quantity || 0,
        unit: data.unit || "шт",
        is_weighted: data.is_weighted || false,
        min_stock: data.min_stock || 5,
        sales_count: data.sales_count || 0
      };
    }
    
    console.log(`✅ Загружено товаров: ${Object.keys(products).length}`);
    
    // Загружаем продажи
    const salesSnapshot = await getSalesRef().orderBy('timestamp', 'desc').get();
    sales = [];
    
    for (const doc of salesSnapshot.docs) {
      const data = doc.data();
      sales.push({
        number: data.number,
        date: data.date,
        timestamp: data.timestamp,
        total: data.total,
        cashier: data.cashier,
        items: data.items || [],
        cash: data.cash,
        change: data.change
      });
    }
    
    console.log(`✅ Загружено продаж: ${sales.length}`);
    
    updateSyncStatus("✅");
    setStatus(`📦 Товаров: ${Object.keys(products).length} | 💰 Продаж: ${sales.length}`);
    
    // Обновляем интерфейс
    renderProducts();
    renderHistory();
    renderStock();
    renderQuickButtons();
    
  } catch (error) {
    console.error("Ошибка загрузки:", error);
    updateSyncStatus("❌");
    setStatus("❌ Ошибка подключения к Firebase");
  }
}

// ==================== СОХРАНЕНИЕ ДАННЫХ ====================
async function saveProduct(code) {
  const product = products[code];
  if (!product) return false;
  
  try {
    await getProductsRef().doc(code).set({
      name: product.name,
      price: product.price,
      purchase_price: product.purchase_price,
      quantity: product.quantity,
      unit: product.unit,
      is_weighted: product.is_weighted,
      min_stock: product.min_stock,
      sales_count: product.sales_count
    });
    updateSyncStatus("✅");
    return true;
  } catch (error) {
    console.error("Ошибка сохранения:", error);
    updateSyncStatus("❌");
    return false;
  }
}

async function saveSale(sale) {
  try {
    await getSalesRef().doc(String(sale.number)).set(sale);
    return true;
  } catch (error) {
    console.error("Ошибка сохранения продажи:", error);
    return false;
  }
}

// ==================== ОТРИСОВКА ТОВАРОВ ====================
function renderProducts() {
  const search = document.getElementById('searchProducts')?.value.toLowerCase() || '';
  const tbody = document.getElementById('productsBody');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  const filtered = Object.values(products).filter(p => 
    !search || p.name.toLowerCase().includes(search) || p.code.includes(search)
  );
  
  for (const product of filtered) {
    const row = tbody.insertRow();
    row.insertCell(0).textContent = product.code;
    row.insertCell(1).textContent = product.name;
    row.insertCell(2).textContent = `${product.price.toFixed(2)} ₸`;
    row.insertCell(3).textContent = product.is_weighted ? `${product.quantity.toFixed(2)} кг` : `${Math.floor(product.quantity)} ${product.unit}`;
  }
}

// ==================== ОТРИСОВКА СКЛАДА ====================
function renderStock() {
  const search = document.getElementById('searchStock')?.value.toLowerCase() || '';
  const tbody = document.getElementById('stockBody');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  const filtered = Object.values(products).filter(p => 
    !search || p.name.toLowerCase().includes(search) || p.code.includes(search)
  );
  
  for (const product of filtered) {
    const row = tbody.insertRow();
    
    let statusClass = '';
    let statusText = '';
    
    if (product.quantity <= 0) {
      statusClass = 'stock-out';
      statusText = 'Нет в наличии';
    } else if (product.quantity < product.min_stock) {
      statusClass = 'stock-low';
      statusText = 'Мало';
    } else {
      statusClass = 'stock-ok';
      statusText = 'В наличии';
    }
    
    row.insertCell(0).textContent = product.code;
    row.insertCell(1).textContent = product.name;
    row.insertCell(2).textContent = `${product.price.toFixed(2)} ₸`;
    row.insertCell(3).textContent = product.is_weighted ? `${product.quantity.toFixed(2)} кг` : `${Math.floor(product.quantity)} ${product.unit}`;
    row.insertCell(4).innerHTML = `<span class="${statusClass}">${statusText}</span>`;
  }
}

// ==================== ОТРИСОВКА ИСТОРИИ ====================
function renderHistory() {
  const tbody = document.getElementById('historyBody');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  for (const sale of sales.slice(0, 100)) {
    const row = tbody.insertRow();
    row.insertCell(0).textContent = sale.number;
    row.insertCell(1).textContent = sale.date || new Date(sale.timestamp).toLocaleString();
    row.insertCell(2).textContent = `${sale.total.toFixed(2)} ₸`;
    row.insertCell(3).textContent = sale.cashier || '—';
  }
}

// ==================== БЫСТРЫЕ КНОПКИ ====================
function renderQuickButtons() {
  const container = document.getElementById('quickGrid');
  if (!container) return;
  
  container.innerHTML = '';
  
  const topProducts = Object.values(products)
    .filter(p => p.quantity > 0)
    .sort((a, b) => (b.sales_count || 0) - (a.sales_count || 0))
    .slice(0, 8);
  
  for (const product of topProducts) {
    const btn = document.createElement('div');
    btn.className = 'quick-btn';
    btn.innerHTML = `
      <div class="quick-name">${escapeHtml(product.name)}</div>
      <div class="quick-price">${product.price.toFixed(0)} ₸</div>
    `;
    btn.onclick = () => addProductByCode(product.code);
    container.appendChild(btn);
  }
  
  if (topProducts.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;padding:8px">Нет товаров</div>';
  }
}

// ==================== КОРЗИНА ====================
function renderCart() {
  const container = document.getElementById('cartList');
  if (!container) return;
  
  if (cart.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#999;padding:40px">Корзина пуста<br>Отсканируйте товар</div>';
    document.getElementById('totalAmount').textContent = '0.00 ₸';
    return;
  }
  
  container.innerHTML = '';
  let total = 0;
  
  for (let i = 0; i < cart.length; i++) {
    const item = cart[i];
    const itemTotal = item.price * item.qty;
    total += itemTotal;
    
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div class="cart-info">
        <div class="cart-name">${escapeHtml(item.name)}</div>
        <div class="cart-price">${item.price.toFixed(2)} ₸ / ${item.unit}</div>
        <div class="cart-qty">
          <button class="qty-btn" onclick="changeQuantity(${i}, -1)">−</button>
          <span class="qty-value">${item.is_weighted ? item.qty.toFixed(2) : Math.floor(item.qty)} ${item.unit}</span>
          <button class="qty-btn" onclick="changeQuantity(${i}, 1)">+</button>
        </div>
      </div>
      <div class="cart-total">${itemTotal.toFixed(2)} ₸</div>
      <button class="cart-delete" onclick="removeFromCart(${i})">🗑</button>
    `;
    container.appendChild(div);
  }
  
  document.getElementById('totalAmount').textContent = `${total.toFixed(2)} ₸`;
}

function changeQuantity(index, delta) {
  const item = cart[index];
  if (!item) return;
  
  const product = products[item.code];
  const maxQty = product ? product.quantity : Infinity;
  const newQty = item.qty + delta;
  
  if (newQty <= 0) {
    removeFromCart(index);
  } else if (newQty <= maxQty) {
    item.qty = newQty;
    renderCart();
  } else {
    setStatus(`❌ Недостаточно на складе. Доступно: ${maxQty} ${item.unit}`);
  }
}

function removeFromCart(index) {
  cart.splice(index, 1);
  renderCart();
  setStatus('🗑 Товар удалён из корзины');
}

function clearCart() {
  if (cart.length > 0 && confirm('Очистить всю корзину?')) {
    cart = [];
    renderCart();
    setStatus('Корзина очищена');
  }
}

// ==================== ДОБАВЛЕНИЕ ТОВАРА ====================
function addByBarcode() {
  const input = document.getElementById('barcode');
  const code = input.value.trim();
  if (code) {
    addProductByCode(code);
    input.value = '';
    input.focus();
  }
}

async function addProductByCode(code) {
  const product = products[code];
  
  if (!product) {
    setStatus(`❌ Товар с кодом "${code}" не найден в базе`);
    return;
  }
  
  if (product.quantity <= 0) {
    setStatus(`❌ Товар "${product.name}" закончился на складе`);
    return;
  }
  
  // Проверяем остаток с учётом корзины
  const inCart = cart.find(i => i.code === code)?.qty || 0;
  const available = product.quantity - inCart;
  
  if (available <= 0) {
    setStatus(`❌ Весь остаток "${product.name}" уже в корзине`);
    return;
  }
  
  if (product.is_weighted) {
    // Весовой товар
    pendingProduct = product;
    document.getElementById('qtyTitle').textContent = `⚖️ ${product.name}`;
    document.getElementById('qtyInfo').innerHTML = `Цена: ${product.price.toFixed(2)} ₸/кг<br>Доступно: ${available.toFixed(2)} кг`;
    document.getElementById('qtyValue').value = '1.000';
    document.getElementById('qtyValue').step = '0.001';
    showModal('qtyModal');
  } else {
    // Обычный товар
    addToCart(product, 1);
  }
}

function addToCart(product, qty) {
  const existing = cart.find(item => item.code === product.code);
  
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      code: product.code,
      name: product.name,
      price: product.price,
      qty: qty,
      unit: product.unit,
      is_weighted: product.is_weighted,
      purchase_price: product.purchase_price || 0
    });
  }
  
  renderCart();
  setStatus(`✅ Добавлен: ${product.name} x${qty.toFixed(3)} ${product.unit}`);
}

function confirmQty() {
  if (!pendingProduct) return;
  
  const qty = parseFloat(document.getElementById('qtyValue').value);
  
  if (isNaN(qty) || qty <= 0) {
    setStatus('❌ Введите корректное количество');
    return;
  }
  
  const product = pendingProduct;
  const inCart = cart.find(i => i.code === product.code)?.qty || 0;
  const available = product.quantity - inCart;
  
  if (qty > available) {
    setStatus(`❌ Недостаточно на складе. Доступно: ${available.toFixed(2)} кг`);
    return;
  }
  
  addToCart(product, qty);
  pendingProduct = null;
  closeModal('qtyModal');
}

// ==================== ОПЛАТА ====================
function showPayment() {
  if (cart.length === 0) {
    setStatus('❌ Корзина пуста');
    return;
  }
  
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  document.getElementById('modalTotal').textContent = `${total.toFixed(2)} ₸`;
  document.getElementById('cashAmount').value = total.toFixed(2);
  document.getElementById('changeAmount').textContent = '0';
  showModal('paymentModal');
}

async function confirmPayment() {
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
  
  if (cash < total) {
    setStatus('❌ Недостаточно средств');
    return;
  }
  
  const change = cash - total;
  
  // Обновляем остатки в Firebase
  for (const item of cart) {
    const product = products[item.code];
    if (product) {
      product.quantity -= item.qty;
      product.sales_count = (product.sales_count || 0) + item.qty;
      await saveProduct(item.code);
    }
  }
  
  // Создаём продажу
  const saleNumber = sales.length > 0 ? Math.max(...sales.map(s => s.number || 0)) + 1 : 1;
  const now = new Date();
  
  const sale = {
    number: saleNumber,
    date: now.toLocaleString('ru-RU'),
    timestamp: now.toISOString(),
    total: total,
    cash: cash,
    change: change,
    cashier: currentCashier,
    items: cart.map(item => ({
      name: item.name,
      qty: item.qty,
      price: item.price,
      total: item.price * item.qty,
      unit: item.unit,
      is_weighted: item.is_weighted
    }))
  };
  
  await saveSale(sale);
  sales.unshift(sale);
  
  // Очищаем корзину
  cart = [];
  renderCart();
  renderProducts();
  renderStock();
  renderHistory();
  renderQuickButtons();
  
  closeModal('paymentModal');
  setStatus(`✅ Продажа №${saleNumber} на сумму ${total.toFixed(2)} ₸`);
  
  // Показываем чек
  alert(`═══════════════════════\n       ЧЕК №${saleNumber}\n═══════════════════════\n${cart.map(i => i.name).join('\n')}\n═══════════════════════\nСумма: ${total.toFixed(2)} ₸\nОплачено: ${cash.toFixed(2)} ₸\nСдача: ${change.toFixed(2)} ₸\n═══════════════════════\n     Спасибо за покупку!\n═══════════════════════`);
}

// ==================== СКАНЕР ШТРИХКОДА ====================
async function toggleScanner() {
  const btn = document.getElementById('scannerBtn');
  
  if (scannerActive) {
    if (html5QrCode) {
      await html5QrCode.stop();
      html5QrCode.clear();
    }
    scannerActive = false;
    btn.textContent = '📷 Вкл/Выкл';
    btn.className = 'scanner-btn off';
  } else {
    try {
      html5QrCode = new Html5Qrcode("reader");
      const cameras = await Html5Qrcode.getCameras();
      
      if (cameras.length === 0) {
        throw new Error("Камеры не найдены");
      }
      
      const backCamera = cameras.find(c => 
        c.label.toLowerCase().includes('back') || 
        c.label.toLowerCase().includes('rear') ||
        c.label.toLowerCase().includes('environment')
      );
      
      const cameraId = backCamera ? backCamera.id : cameras[0].id;
      
      await html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: { width: 250, height: 200 } },
        (decodedText) => {
          document.getElementById('barcode').value = decodedText;
          addProductByCode(decodedText);
          document.getElementById('barcode').value = '';
        },
        (error) => {}
      );
      
      scannerActive = true;
      btn.textContent = '📷 Вкл/Выкл';
      btn.className = 'scanner-btn on';
      setStatus('✅ Сканер активен');
    } catch (err) {
      console.error("Ошибка сканера:", err);
      setStatus('❌ Не удалось запустить камеру');
      alert("Не удалось запустить камеру. Проверьте разрешения.");
    }
  }
}

// ==================== НАВИГАЦИЯ ====================
function switchPage(page) {
  const pages = ['sale', 'products', 'history', 'stock'];
  
  for (const p of pages) {
    const el = document.getElementById(`page${p.charAt(0).toUpperCase() + p.slice(1)}`);
    if (el) el.classList.remove('active');
  }
  
  document.getElementById(`page${page.charAt(0).toUpperCase() + page.slice(1)}`).classList.add('active');
  
  const btns = document.querySelectorAll('.nav-btn');
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', i === pages.indexOf(page));
  }
  
  if (page === 'products') renderProducts();
  if (page === 'history') renderHistory();
  if (page === 'stock') renderStock();
}

// ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
function showModal(id) {
  document.getElementById(id).classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if (id === 'qtyModal') {
    pendingProduct = null;
  }
}

function updateSyncStatus(text) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = text;
}

function setStatus(text) {
  const el = document.getElementById('statusBar');
  if (el) el.textContent = text;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}
